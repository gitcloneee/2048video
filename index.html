<script>
const W = 1080;
const H = 1920;
const GRID_SIZE = 1080;
const CELL = 360;
const GRID_TOP = (H - GRID_SIZE) / 2;

const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d', { alpha: false, desynchronized: true });
ctx.imageSmoothingEnabled = true;
ctx.imageSmoothingQuality = 'high';

const statusEl = document.getElementById('status');
const bgAudio = document.getElementById('bgAudio');
const audioStatus = document.getElementById('audioStatus');
const audioState = document.getElementById('audioState');
const finalModeSelect = document.getElementById('finalMode');
const bgEngineSelect = document.getElementById('bgEngine');
const scrubber = document.getElementById('scrubber');
const timeLabel = document.getElementById('timeLabel');

const originalImages = {};  // Raw uploaded Image objects
const cutoutCanvases = {};  // Processed transparent cutout canvases
const activeSources = {};   // Points to either cutoutCanvases[i] or originalImages[i]
const cachedCells = {};     // 360x360 pre-scaled offscreen buffers for 60 FPS rendering

bgAudio.addEventListener('loadedmetadata', () => {
  audioStatus.classList.remove('error');
  audioState.textContent = `Ready (${bgAudio.duration.toFixed(1)}s) ✓`;
});

bgAudio.addEventListener('error', () => {
  audioStatus.classList.add('error');
  audioState.textContent = 'Place audio.mp3 in this folder!';
});

// ==========================================
// AUTO BACKGROUND REMOVAL ENGINE (AI + OFFLINE FALLBACK)
// ==========================================
let segmenter = null;
let segmentQueue = Promise.resolve();

async function getAISegmenter() {
  if (segmenter) return segmenter;
  if (typeof SelfieSegmentation === 'undefined') return null;
  try {
    const s = new SelfieSegmentation({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${file}`
    });
    s.setOptions({ modelSelection: 1 });
    await s.initialize();
    segmenter = s;
    return segmenter;
  } catch (err) {
    console.warn('AI Segmenter unavailable, using offline flood-fill fallback:', err);
    return null;
  }
}

// Automatically trims excess transparent borders so cutouts fill their 360x360 slot nicely
function autoTrimTransparentCanvas(srcCanvas) {
  const w = srcCanvas.width;
  const h = srcCanvas.height;
  const sctx = srcCanvas.getContext('2d');
  const data = sctx.getImageData(0, 0, w, h).data;

  let minX = w, minY = h, maxX = 0, maxY = 0;
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const alpha = data[(y * w + x) * 4 + 3];
      if (alpha > 25) {
        if (x < minX) minX = x;
        if (x > maxX) maxX = x;
        if (y < minY) minY = y;
        if (y > maxY) maxY = y;
      }
    }
  }

  if (maxX <= minX || maxY <= minY) return srcCanvas;

  const pad = Math.round(Math.max(w, h) * 0.02);
  const sx = Math.max(0, minX - pad);
  const sy = Math.max(0, minY - pad);
  const sw = Math.min(w - sx, (maxX - minX) + pad * 2);
  const sh = Math.min(h - sy, (maxY - minY) + pad * 2);

  const trimmed = document.createElement('canvas');
  trimmed.width = sw;
  trimmed.height = sh;
  trimmed.getContext('2d').drawImage(srcCanvas, sx, sy, sw, sh, 0, 0, sw, sh);
  return trimmed;
}

// Offline Corner Flood-Fill Background Remover
function removeBgFloodFill(img) {
  const w = img.width;
  const h = img.height;
  const off = document.createElement('canvas');
  off.width = w;
  off.height = h;
  const octx = off.getContext('2d');
  octx.drawImage(img, 0, 0);

  const imgData = octx.getImageData(0, 0, w, h);
  const d = imgData.data;
  const visited = new Uint8Array(w * h);

  // Sample corners to determine background color
  const corners = [
    [0, 0], [w - 1, 0], [0, h - 1], [w - 1, h - 1],
    [Math.floor(w / 2), 0]
  ];
  const samples = corners.map(([cx, cy]) => {
    const idx = (cy * w + cx) * 4;
    return [d[idx], d[idx + 1], d[idx + 2]];
  });

  const tolerance = 46;
  const tolSq = tolerance * tolerance * 3;

  function matchesBg(idx) {
    const r = d[idx], g = d[idx + 1], b = d[idx + 2];
    for (const [sr, sg, sb] of samples) {
      const dr = r - sr, dg = g - sg, db = b - sb;
      if (dr * dr + dg * dg + db * db <= tolSq) return true;
    }
    return false;
  }

  const stack = [];
  for (let x = 0; x < w; x++) {
    stack.push(x, (h - 1) * w + x);
  }
  for (let y = 0; y < h; y++) {
    stack.push(y * w, y * w + (w - 1));
  }

  while (stack.length > 0) {
    const p = stack.pop();
    if (visited[p]) continue;
    visited[p] = 1;

    const idx = p * 4;
    if (matchesBg(idx)) {
      d[idx + 3] = 0;
      const x = p % w;
      const y = (p - x) / w;
      if (x > 0 && !visited[p - 1]) stack.push(p - 1);
      if (x < w - 1 && !visited[p + 1]) stack.push(p + 1);
      if (y > 0 && !visited[p - w]) stack.push(p - w);
      if (y < h - 1 && !visited[p + w]) stack.push(p + w);
    }
  }

  octx.putImageData(imgData, 0, 0);
  return autoTrimTransparentCanvas(off);
}

// AI Portrait Segmentation Background Remover
async function removeBgAI(img) {
  const seg = await getAISegmenter();
  if (!seg) return removeBgFloodFill(img);

  return new Promise((resolve) => {
    seg.onResults((results) => {
      const w = img.width;
      const h = img.height;
      const off = document.createElement('canvas');
      off.width = w;
      off.height = h;
      const octx = off.getContext('2d');

      // Draw feathered AI person mask
      octx.save();
      octx.filter = 'blur(1.5px)';
      octx.drawImage(results.segmentationMask, 0, 0, w, h);
      octx.restore();

      // Keep only foreground person pixels
      octx.globalCompositeOperation = 'source-in';
      octx.drawImage(img, 0, 0, w, h);

      resolve(autoTrimTransparentCanvas(off));
    });
    seg.send({ image: img });
  });
}

function buildCellCache(lvl) {
  const src = activeSources[lvl];
  if (!src) return;

  const isCutout = document.getElementById('bg' + lvl).checked;
  const off = document.createElement('canvas');
  off.width = CELL;
  off.height = CELL;
  const octx = off.getContext('2d');
  octx.imageSmoothingEnabled = true;
  octx.imageSmoothingQuality = 'high';

  const pad = 10;
  const box = CELL - pad * 2;
  const sw = src.width;
  const sh = src.height;

  if (!isCutout && (lvl === 3 || lvl === 5)) {
    // 1:1 square center-crop for non-cutout square stages
    const s = Math.max(box / sw, box / sh);
    const cw = box / s;
    const ch = box / s;
    const sx = (sw - cw) / 2;
    const sy = (sh - ch) / 2;
    octx.drawImage(src, sx, sy, cw, ch, pad, pad, box, box);
  } else {
    // Clean aspect-fit inside slot for cutout stages
    const s = Math.min(box / sw, box / sh);
    const dw = sw * s;
    const dh = sh * s;
    octx.drawImage(src, pad + (box - dw) / 2, pad + (box - dh) / 2, dw, dh);
  }
  cachedCells[lvl] = off;
}

async function processPhotoSlot(lvl, forceRecompute = false) {
  const img = originalImages[lvl];
  if (!img) return;

  const wantRemoveBg = document.getElementById('bg' + lvl).checked;
  const thumbEl = document.getElementById('t' + lvl);

  if (wantRemoveBg) {
    if (!cutoutCanvases[lvl] || forceRecompute) {
      statusEl.textContent = `Removing background for Photo ${lvl}...`;
      const engine = bgEngineSelect.value;
      if (engine === 'ai') {
        segmentQueue = segmentQueue.then(async () => {
          cutoutCanvases[lvl] = await removeBgAI(img);
        });
        await segmentQueue;
      } else {
        cutoutCanvases[lvl] = removeBgFloodFill(img);
      }
    }
    activeSources[lvl] = cutoutCanvases[lvl];
    thumbEl.src = cutoutCanvases[lvl].toDataURL('image/png');
    statusEl.textContent = `Photo ${lvl} background removed ✓`;
  } else {
    activeSources[lvl] = img;
    thumbEl.src = img.src;
    statusEl.textContent = `Photo ${lvl} restored to original.`;
  }

  buildCellCache(lvl);
  drawFrame(parseFloat(scrubber.value));
}

for (let i = 1; i <= 6; i++) {
  document.getElementById('p' + i).addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      originalImages[i] = img;
      delete cutoutCanvases[i];
      processPhotoSlot(i, true);
    };
    img.src = url;
  });

  document.getElementById('bg' + i).addEventListener('change', () => {
    processPhotoSlot(i, false);
  });
}

bgEngineSelect.addEventListener('change', () => {
  for (let i = 1; i <= 6; i++) {
    if (originalImages[i] && document.getElementById('bg' + i).checked) {
      processPhotoSlot(i, true);
    }
  }
});

scrubber.addEventListener('input', () => {
  const t = parseFloat(scrubber.value);
  timeLabel.textContent = t.toFixed(2) + 's';
  drawFrame(t);
});

finalModeSelect.addEventListener('change', () => drawFrame(parseFloat(scrubber.value)));

function smoothGlide(p) {
  p = Math.max(0, Math.min(1, p));
  return p * p * p * (p * (p * 6 - 15) + 10);
}

function springPop(dt) {
  if (dt < 0 || dt > 0.26) return 1;
  const u = dt / 0.26;
  return 1 + 0.11 * Math.sin(u * Math.PI * 1.5) * (1 - u);
}

function getSceneAtTime(sec) {
  let board = {};
  let activeMove = null;
  let cellAlpha = {};
  let cellScale = {};
  let mergeCount = 0;

  for (const ev of TIMELINE) {
    if (sec < ev.t) continue;

    if (ev.type === 'board') {
      board = { ...ev.state };
    } else if (ev.type === 'spawn') {
      ev.cells.forEach((c, idx) => {
        const delay = (idx / ev.cells.length) * (ev.dur * 0.55);
        const localT = sec - (ev.t + delay);
        if (localT >= 0) {
          board[c] = ev.lvl;
          if (localT < 0.24) {
            const sp = smoothGlide(localT / 0.24);
            cellScale[c] = 0.25 + 0.75 * sp;
            cellAlpha[c] = sp;
          }
        }
      });
    } else if (ev.type === 'fadein') {
      board[ev.cell] = ev.lvl;
      if (sec < ev.t + ev.dur) {
        const fp = smoothGlide((sec - ev.t) / ev.dur);
        cellAlpha[ev.cell] = fp;
        cellScale[ev.cell] = 0.92 + 0.08 * fp;
      }
    } else if (ev.type === 'move') {
      if (sec < ev.t + ev.dur) {
        delete board[ev.from];
        const rawP = (sec - ev.t) / ev.dur;
        const p = smoothGlide(rawP);

        if (rawP > 0.80) {
          const impactP = (rawP - 0.80) / 0.20;
          cellScale[ev.to] = 1 - 0.06 * Math.sin(impactP * Math.PI);
        }

        activeMove = {
          from: ev.from,
          to: ev.to,
          lvl: ev.lvl,
          next: ev.next,
          rawP,
          p
        };
      } else {
        delete board[ev.from];
        board[ev.to] = ev.next;
        mergeCount++;
        const pop = springPop(sec - (ev.t + ev.dur));
        if (pop !== 1) cellScale[ev.to] = pop;
      }
    }
  }
  return { board, activeMove, cellAlpha, cellScale, mergeCount };
}

function drawSlotPhoto(lvl, x, y, alpha = 1, scaleX = 1, scaleY = 1) {
  ctx.save();
  if (alpha !== 1) ctx.globalAlpha = Math.max(0, Math.min(1, alpha));

  if (scaleX !== 1 || scaleY !== 1) {
    const cx = x + CELL / 2;
    const cy = y + CELL / 2;
    ctx.translate(cx, cy);
    ctx.scale(scaleX, scaleY);
    ctx.translate(-cx, -cy);
  }

  const cached = cachedCells[lvl];
  if (cached) {
    ctx.drawImage(cached, x, y);
  } else {
    ctx.fillStyle = '#f3f4f6';
    ctx.fillRect(x + 14, y + 14, CELL - 28, CELL - 28);
    ctx.strokeStyle = '#d1d5db';
    ctx.lineWidth = 2;
    ctx.strokeRect(x + 14, y + 14, CELL - 28, CELL - 28);
    ctx.fillStyle = '#111827';
    ctx.font = 'bold 34px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Photo ' + lvl, x + CELL / 2, y + CELL / 2 + 12);
  }
  ctx.restore();
}

function drawFinalReveal(sec) {
  const expandP = smoothGlide((sec - 33.26) / 0.44);
  const src = activeSources[6];
  const mode = finalModeSelect.value;

  let targetW = W;
  let targetH = (mode === 'square_center') ? W : H;
  if (mode === 'reels_fit' && src) {
    const ratio = src.height / src.width;
    targetH = Math.min(H, W * ratio);
  }

  const curW = CELL + (targetW - CELL) * expandP;
  const curH = CELL + (targetH - CELL) * expandP;
  const curX = (W - curW) / 2;
  const curY = (H - curH) / 2;

  if (!src) {
    ctx.fillStyle = '#f3f4f6';
    ctx.fillRect(curX, curY, curW, curH);
    ctx.fillStyle = '#111827';
    ctx.font = 'bold 52px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Photo 6 (Final Reveal)', W / 2, H / 2);
    return;
  }

  const isCutout = document.getElementById('bg6').checked;
  if (mode === 'reels_fit' || isCutout) {
    const s = Math.min(curW / src.width, curH / src.height);
    const dw = src.width * s;
    const dh = src.height * s;
    ctx.drawImage(src, curX + (curW - dw) / 2, curY + (curH - dh) / 2, dw, dh);
  } else {
    const s = Math.max(curW / src.width, curH / src.height);
    const sw = curW / s;
    const sh = curH / s;
    const sx = (src.width - sw) / 2;
    const sy = (src.height - sh) / 2;
    ctx.drawImage(src, sx, sy, sw, sh, curX, curY, curW, curH);
  }
}

function drawFrame(sec) {
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, W, H);

  if (sec >= 33.26) {
    drawFinalReveal(sec);
    return 32;
  }

  const { board, activeMove, cellAlpha, cellScale, mergeCount } = getSceneAtTime(sec);

  for (const [slot, lvl] of Object.entries(board)) {
    const [gx, gy] = SLOTS[slot];
    const alpha = cellAlpha[slot] !== undefined ? cellAlpha[slot] : 1;
    const sc = cellScale[slot] !== undefined ? cellScale[slot] : 1;
    drawSlotPhoto(lvl, gx * CELL, GRID_TOP + gy * CELL, alpha, sc, sc);
  }

  if (activeMove) {
    const [fx, fy] = SLOTS[activeMove.from];
    const [tx, ty] = SLOTS[activeMove.to];
    const cx = (fx + (tx - fx) * activeMove.p) * CELL;
    const cy = GRID_TOP + (fy + (ty - fy) * activeMove.p) * CELL;

    const vel = Math.sin(activeMove.rawP * Math.PI);
    const isHoriz = Math.abs(tx - fx) >= Math.abs(ty - fy);
    const sx = 1.02 + (isHoriz ? 0.025 * vel : -0.015 * vel);
    const sy = 1.02 + (isHoriz ? -0.015 * vel : 0.025 * vel);

    const moveAlpha = activeMove.rawP > 0.85 ? (1 - (activeMove.rawP - 0.85) / 0.15 * 0.35) : 1;
    drawSlotPhoto(activeMove.lvl, cx, cy, moveAlpha, sx, sy);
  }
  return mergeCount;
}

let animId = null;
function startPlayback(onComplete) {
  cancelAnimationFrame(animId);
  const totalDuration = 34.7;
  let lastPerf = performance.now();
  let smoothTime = 0;
  let audioPlaying = false;

  bgAudio.currentTime = 0;
  bgAudio.play().then(() => {
    audioPlaying = true;
  }).catch(() => {
    audioPlaying = false;
  });

  function loop(now) {
    const dt = (now - lastPerf) / 1000;
    lastPerf = now;
    smoothTime += dt;

    if (audioPlaying && !bgAudio.paused) {
      const audioT = bgAudio.currentTime;
      const err = audioT - smoothTime;
      if (Math.abs(err) > 0.08) {
        smoothTime = audioT;
      } else {
        smoothTime += err * 0.25;
      }
    }

    const merges = drawFrame(smoothTime);
    scrubber.value = Math.min(totalDuration, smoothTime);
    timeLabel.textContent = smoothTime.toFixed(2) + 's';
    statusEl.textContent = `60 FPS Audio-Synced: ${smoothTime.toFixed(2)}s / ${totalDuration}s • Merges: ${merges}/32`;

    if (smoothTime < totalDuration && (!audioPlaying || !bgAudio.ended)) {
      animId = requestAnimationFrame(loop);
    } else {
      bgAudio.pause();
      drawFrame(totalDuration);
      scrubber.value = totalDuration;
      timeLabel.textContent = totalDuration.toFixed(2) + 's';
      statusEl.textContent = 'Completed all 32 merges (1080×1920 @ 60 FPS)!';
      if (onComplete) onComplete();
    }
  }
  animId = requestAnimationFrame(loop);
}

document.getElementById('previewBtn').addEventListener('click', () => startPlayback());

document.getElementById('recordBtn').addEventListener('click', () => {
  const stream = canvas.captureStream(60);

  try {
    const audioStream = bgAudio.captureStream ? bgAudio.captureStream() : (bgAudio.mozCaptureStream ? bgAudio.mozCaptureStream() : null);
    if (audioStream) {
      audioStream.getAudioTracks().forEach(track => stream.addTrack(track));
    }
  } catch (e) {
    console.warn('Audio stream capture note:', e);
  }

  const mimeTypes = [
    'video/mp4;codecs=avc1.42E01E,mp4a.40.2',
    'video/mp4',
    'video/webm;codecs=vp9',
    'video/webm'
  ];
  const selectedMime = mimeTypes.find(m => MediaRecorder.isTypeSupported(m)) || 'video/webm';
  const ext = selectedMime.includes('mp4') ? 'mp4' : 'webm';

  const recorder = new MediaRecorder(stream, {
    mimeType: selectedMime,
    videoBitsPerSecond: 16000000
  });

  const chunks = [];
  recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
  recorder.onstop = () => {
    const blob = new Blob(chunks, { type: selectedMime });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `instagram_reel_merge_1080p60.${ext}`;
    a.click();
    document.getElementById('recordBtn').disabled = false;
  };

  document.getElementById('recordBtn').disabled = true;
  recorder.start();
  startPlayback(() => recorder.stop());
});

drawFrame(0);
</script>
