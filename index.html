<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instagram Reels 60FPS Photo Merge Maker</title>
<style>
  body { font-family: system-ui, -apple-system, sans-serif; background: #0f0f11; color: #f5f5f5; margin: 0; padding: 16px; display: flex; flex-direction: column; align-items: center; }
  .panel { background: #1a1a1e; padding: 16px; border-radius: 14px; max-width: 560px; width: 100%; box-sizing: border-box; margin-bottom: 16px; border: 1px solid #2e2e34; }
  .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  h2 { margin: 0; font-size: 1.1rem; }
  .pill { background: #2563eb; color: #fff; font-size: 0.72rem; font-weight: 700; padding: 4px 8px; border-radius: 6px; }
  .grid-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  .slot-card { background: #242429; padding: 8px 10px; border-radius: 8px; border: 1px solid #36363e; display: flex; align-items: center; gap: 8px; }
  .thumb { width: 38px; height: 38px; border-radius: 6px; background: #fff; object-fit: contain; flex-shrink: 0; border: 1px solid #444; }
  .slot-info { flex: 1; overflow: hidden; }
  label { font-size: 0.76rem; font-weight: 600; color: #e4e4e7; display: block; margin-bottom: 3px; }
  input[type="file"] { width: 100%; font-size: 0.7rem; color: #a1a1aa; }
  .options-row { display: flex; gap: 10px; margin-bottom: 12px; align-items: center; background: #242429; padding: 8px 12px; border-radius: 8px; border: 1px solid #36363e; font-size: 0.8rem; }
  .options-row select { background: #18181b; color: #fff; border: 1px solid #444; border-radius: 6px; padding: 5px 8px; font-size: 0.78rem; flex: 1; }
  .audio-bar { background: #1e2923; padding: 8px 12px; border-radius: 8px; font-size: 0.8rem; color: #34d399; border: 1px solid #065f46; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
  .audio-bar.error { background: #2d1a1a; color: #f87171; border-color: #7f1d1d; }
  .btn-row { display: flex; gap: 10px; }
  button { flex: 1; padding: 12px 14px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 0.9rem; transition: opacity 0.15s; }
  #previewBtn { background: #3b82f6; color: #fff; }
  #recordBtn { background: #10b981; color: #fff; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .canvas-wrap { width: 100%; max-width: 340px; aspect-ratio: 9 / 16; border-radius: 14px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.65); border: 2px solid #2e2e34; background: #ffffff; }
  canvas { width: 100%; height: 100%; display: block; }
  #status { font-size: 0.82rem; color: #fbbf24; margin-top: 10px; min-height: 1.2em; text-align: center; }
</style>
</head>
<body>

<div class="panel">
  <div class="header-row">
    <h2>Reels 3×3 Photo Merge Generator</h2>
    <span class="pill">1080×1920 • 60 FPS</span>
  </div>

  <div class="grid-inputs">
    <div class="slot-card">
      <img id="t1" class="thumb" alt="P1">
      <div class="slot-info"><label>Photo 1 (Baby Cutout)</label><input type="file" id="p1" accept="image/*"></div>
    </div>
    <div class="slot-card">
      <img id="t2" class="thumb" alt="P2">
      <div class="slot-info"><label>Photo 2 (Kid Cutout)</label><input type="file" id="p2" accept="image/*"></div>
    </div>
    <div class="slot-card">
      <img id="t3" class="thumb" alt="P3">
      <div class="slot-info"><label>Photo 3 (Pre-teen 1:1)</label><input type="file" id="p3" accept="image/*"></div>
    </div>
    <div class="slot-card">
      <img id="t4" class="thumb" alt="P4">
      <div class="slot-info"><label>Photo 4 (Teen Cutout)</label><input type="file" id="p4" accept="image/*"></div>
    </div>
    <div class="slot-card">
      <img id="t5" class="thumb" alt="P5">
      <div class="slot-info"><label>Photo 5 (Close-up 1:1)</label><input type="file" id="p5" accept="image/*"></div>
    </div>
    <div class="slot-card">
      <img id="t6" class="thumb" alt="P6">
      <div class="slot-info"><label>Photo 6 (Final Reveal)</label><input type="file" id="p6" accept="image/*"></div>
    </div>
  </div>

  <div class="options-row">
    <span>Final Photo 6 Reveal Mode:</span>
    <select id="finalMode">
      <option value="reels_full">Full 9:16 Reels Screen (1080×1920)</option>
      <option value="reels_fit">Fit Full Width Inside Reels (No Crop)</option>
      <option value="square_center">1:1 Center Square (1080×1080)</option>
    </select>
  </div>

  <div id="audioStatus" class="audio-bar">
    <span>Audio: <b>audio.mp3</b> (Local Storage)</span>
    <span id="audioState">Checking...</span>
  </div>

  <div class="btn-row">
    <button id="previewBtn">Preview (60 FPS)</button>
    <button id="recordBtn">Record 1080p60 Reels</button>
  </div>
  <div id="status">Select your 6 gallery photos to begin.</div>
</div>

<!-- Instagram Reels Full HD 9:16 Canvas (1080 x 1920) -->
<div class="canvas-wrap">
  <canvas id="stage" width="1080" height="1920"></canvas>
</div>

<!-- Automatically loads audio.mp3 from local folder -->
<audio id="bgAudio" src="audio.mp3" preload="auto"></audio>

<script>
const W = 1080;
const H = 1920;
const GRID_SIZE = 1080;
const CELL = 360; // 1080 / 3
const GRID_TOP = (H - GRID_SIZE) / 2; // 420px vertical offset for 9:16 Reels centering

const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d', { alpha: false, desynchronized: true });
ctx.imageSmoothingEnabled = true;
ctx.imageSmoothingQuality = 'high';

const statusEl = document.getElementById('status');
const bgAudio = document.getElementById('bgAudio');
const audioStatus = document.getElementById('audioStatus');
const audioState = document.getElementById('audioState');
const finalModeSelect = document.getElementById('finalMode');

const rawImages = {};
const cachedCells = {}; // Pre-scaled 360x360 offscreen textures for zero-lag 60fps

bgAudio.addEventListener('loadedmetadata', () => {
  audioStatus.classList.remove('error');
  audioState.textContent = `Ready (${bgAudio.duration.toFixed(1)}s) ✓`;
});

bgAudio.addEventListener('error', () => {
  audioStatus.classList.add('error');
  audioState.textContent = 'Place audio.mp3 in this folder!';
});

// Pre-render uploaded gallery images onto hardware-accelerated offscreen canvases
function buildCellCache(lvl, img) {
  const off = document.createElement('canvas');
  off.width = CELL;
  off.height = CELL;
  const octx = off.getContext('2d');
  octx.imageSmoothingEnabled = true;
  octx.imageSmoothingQuality = 'high';

  const pad = 10;
  const box = CELL - pad * 2;

  if (lvl === 3 || lvl === 5) {
    // 1:1 center-crop for square stages
    const s = Math.max(box / img.width, box / img.height);
    const sw = box / s;
    const sh = box / s;
    const sx = (img.width - sw) / 2;
    const sy = (img.height - sh) / 2;
    octx.drawImage(img, sx, sy, sw, sh, pad, pad, box, box);
  } else {
    // Clean aspect-fit for cutout stages (1, 2, 4)
    const s = Math.min(box / img.width, box / img.height);
    const w = img.width * s;
    const h = img.height * s;
    octx.drawImage(img, pad + (box - w) / 2, pad + (box - h) / 2, w, h);
  }
  cachedCells[lvl] = off;
}

for (let i = 1; i <= 6; i++) {
  document.getElementById('p' + i).addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const url = URL.createObjectURL(file);
    document.getElementById('t' + i).src = url;
    const img = new Image();
    img.onload = () => {
      rawImages[i] = img;
      buildCellCache(i, img);
      drawFrame(0);
    };
    img.src = url;
  });
}

finalModeSelect.addEventListener('change', () => drawFrame(33.5));

const SLOTS = {
  TL: [0, 0], TC: [1, 0], TR: [2, 0],
  ML: [0, 1], MC: [1, 1], MR: [2, 1],
  BL: [0, 2], BC: [1, 2], BR: [2, 2]
};

// Frame-accurate choreography synced to the 34.7s audio.mp3 cues
const TIMELINE = [
  // ROUND 1 (0:00.0 - 0:06.0)
  { type: 'board', t: 0.00, state: { TC:2, TR:1, ML:1, MC:1, MR:1, BL:1, BC:1, BR:1 } },
  { type: 'move',  t: 0.05, dur: 0.85, from: 'ML', to: 'MC', lvl: 1, next: 2 },
  { type: 'move',  t: 1.05, dur: 0.85, from: 'BL', to: 'BC', lvl: 1, next: 2 },
  { type: 'move',  t: 2.05, dur: 0.85, from: 'TC', to: 'MC', lvl: 2, next: 3 },
  { type: 'move',  t: 3.05, dur: 0.85, from: 'TR', to: 'MR', lvl: 1, next: 2 },
  { type: 'move',  t: 4.05, dur: 0.85, from: 'BC', to: 'MR', lvl: 2, next: 3 },
  { type: 'move',  t: 5.05, dur: 0.85, from: 'MR', to: 'MC', lvl: 3, next: 4 },

  // ROUND 2: "Woo hoo hoo!" spawn (0:06.2) + 8 merges (0:06.8 - 0:14.0)
  { type: 'spawn', t: 6.20, dur: 0.50, cells: ['TL','TC','TR','ML','MR','BL','BC'], lvl: 1 },
  { type: 'move',  t: 6.80, dur: 0.80, from: 'TC', to: 'TR', lvl: 1, next: 2 },
  { type: 'move',  t: 7.70, dur: 0.80, from: 'MR', to: 'BR', lvl: 1, next: 2 },
  { type: 'move',  t: 8.55, dur: 0.80, from: 'TR', to: 'BR', lvl: 2, next: 3 },
  { type: 'move',  t: 9.40, dur: 0.80, from: 'BC', to: 'BL', lvl: 1, next: 2 },
  { type: 'move',  t: 10.25, dur: 0.80, from: 'ML', to: 'TL', lvl: 1, next: 2 },
  { type: 'move',  t: 11.10, dur: 0.80, from: 'BL', to: 'TL', lvl: 2, next: 3 },
  { type: 'move',  t: 12.00, dur: 0.85, from: 'BR', to: 'TL', lvl: 3, next: 4 },
  { type: 'move',  t: 13.00, dur: 0.85, from: 'TL', to: 'MC', lvl: 4, next: 5 },

  // ROUND 3: "Woo hoo hoo!" spawn (0:14.2) + 7 diamond merges (0:15.0 - 0:21.6)
  { type: 'spawn', t: 14.20, dur: 0.65, cells: ['TL','TC','TR','ML','MR','BL','BC','BR'], lvl: 1 },
  { type: 'move',  t: 15.05, dur: 0.85, from: 'TL', to: 'ML', lvl: 1, next: 2 },
  { type: 'move',  t: 16.00, dur: 0.85, from: 'BL', to: 'BC', lvl: 1, next: 2 },
  { type: 'move',  t: 16.95, dur: 0.85, from: 'BR', to: 'MR', lvl: 1, next: 2 },
  { type: 'move',  t: 17.90, dur: 0.85, from: 'TR', to: 'TC', lvl: 1, next: 2 },
  { type: 'move',  t: 18.85, dur: 0.85, from: 'ML', to: 'BC', lvl: 2, next: 3 },
  { type: 'move',  t: 19.80, dur: 0.85, from: 'MR', to: 'TC', lvl: 2, next: 3 },
  { type: 'move',  t: 20.75, dur: 0.85, from: 'BC', to: 'TC', lvl: 3, next: 4 },

  // ROUND 4: "Woo hoo hoo!" spawn (0:21.7), merges, "Xiannu xiafan" fade-in (0:26.8), final merge (0:33.0)
  { type: 'spawn', t: 21.70, dur: 0.70, cells: ['TL','TR','ML','MR','BL','BC','BR'], lvl: 1 },
  { type: 'move',  t: 22.50, dur: 0.85, from: 'BR', to: 'TL', lvl: 1, next: 2 },
  { type: 'move',  t: 23.40, dur: 0.80, from: 'TR', to: 'MR', lvl: 1, next: 2 },
  { type: 'move',  t: 24.25, dur: 0.80, from: 'BC', to: 'ML', lvl: 1, next: 2 },
  { type: 'move',  t: 25.10, dur: 0.85, from: 'MR', to: 'TL', lvl: 2, next: 3 },

  // "Xiannu xiafan" voice cue: bonus Photo 1 fades in smoothly at BC
  { type: 'fadein', t: 26.80, dur: 1.50, cell: 'BC', lvl: 1 },

  { type: 'move',  t: 28.45, dur: 0.85, from: 'BC', to: 'BL', lvl: 1, next: 2 },
  { type: 'move',  t: 29.40, dur: 0.85, from: 'BL', to: 'ML', lvl: 2, next: 3 },
  { type: 'move',  t: 30.35, dur: 0.85, from: 'ML', to: 'TL', lvl: 3, next: 4 },
  { type: 'move',  t: 31.30, dur: 0.85, from: 'TL', to: 'TC', lvl: 4, next: 5 },
  { type: 'move',  t: 32.20, dur: 0.80, from: 'TC', to: 'MC', lvl: 5, next: 6 }
];

// Ultra-smooth cubic ease-in-out
function easeInOutCubic(p) {
  return p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
}

// Subtle pop animation when two photos merge into the upgraded photo
function mergePopScale(timeSinceMerge) {
  if (timeSinceMerge < 0 || timeSinceMerge > 0.18) return 1;
  const p = timeSinceMerge / 0.18;
  return 1 + 0.08 * Math.sin(p * Math.PI);
}

function getSceneAtTime(sec) {
  let board = {};
  let activeMove = null;
  let cellAlpha = {};
  let cellScale = {};

  for (const ev of TIMELINE) {
    if (sec < ev.t) continue;

    if (ev.type === 'board') {
      board = { ...ev.state };
    } else if (ev.type === 'spawn') {
      ev.cells.forEach((c, idx) => {
        const delay = (idx / ev.cells.length) * (ev.dur * 0.55);
        const localT = sec - (ev.t + delay);
        if (localT >= 0) {
          board[c] = ev.lvl;
          if (localT < 0.22) {
            const sp = localT / 0.22;
            cellScale[c] = 0.25 + 0.75 * easeInOutCubic(sp);
          }
        }
      });
    } else if (ev.type === 'fadein') {
      board[ev.cell] = ev.lvl;
      if (sec < ev.t + ev.dur) {
        cellAlpha[ev.cell] = Math.max(0, Math.min(1, (sec - ev.t) / ev.dur));
      }
    } else if (ev.type === 'move') {
      if (sec < ev.t + ev.dur) {
        delete board[ev.from];
        activeMove = {
          from: ev.from,
          to: ev.to,
          lvl: ev.lvl,
          p: easeInOutCubic((sec - ev.t) / ev.dur)
        };
      } else {
        delete board[ev.from];
        board[ev.to] = ev.next;
        const pop = mergePopScale(sec - (ev.t + ev.dur));
        if (pop !== 1) cellScale[ev.to] = pop;
      }
    }
  }
  return { board, activeMove, cellAlpha, cellScale };
}

function drawSlotPhoto(lvl, x, y, alpha = 1, scaleFactor = 1) {
  ctx.save();
  if (alpha !== 1) ctx.globalAlpha = alpha;

  if (scaleFactor !== 1) {
    const cx = x + CELL / 2;
    const cy = y + CELL / 2;
    ctx.translate(cx, cy);
    ctx.scale(scaleFactor, scaleFactor);
    ctx.translate(-cx, -cy);
  }

  const cached = cachedCells[lvl];
  if (cached) {
    ctx.drawImage(cached, x, y);
  } else {
    ctx.fillStyle = '#f3f4f6';
    ctx.fillRect(x + 14, y + 14, CELL - 28, CELL - 28);
    ctx.strokeStyle = '#d1d5db';
    ctx.lineWidth = 2;
    ctx.strokeRect(x + 14, y + 14, CELL - 28, CELL - 28);
    ctx.fillStyle = '#111827';
    ctx.font = 'bold 34px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Photo ' + lvl, x + CELL / 2, y + CELL / 2 + 12);
  }
  ctx.restore();
}

function drawFinalReveal(sec) {
  const expandP = Math.min(1, easeInOutCubic((sec - 33.0) / 0.42));
  const img = rawImages[6];
  const mode = finalModeSelect.value;

  // Target rectangle based on selected Reels mode
  let targetW = W;
  let targetH = (mode === 'square_center') ? W : H;
  if (mode === 'reels_fit' && img) {
    const ratio = img.height / img.width;
    targetH = Math.min(H, W * ratio);
  }

  const curW = CELL + (targetW - CELL) * expandP;
  const curH = CELL + (targetH - CELL) * expandP;
  const curX = (W - curW) / 2;
  const curY = (H - curH) / 2;

  if (!img) {
    ctx.fillStyle = '#f3f4f6';
    ctx.fillRect(curX, curY, curW, curH);
    ctx.fillStyle = '#111827';
    ctx.font = 'bold 52px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Photo 6 (Final Reveal)', W / 2, H / 2);
    return;
  }

  if (mode === 'reels_fit') {
    const s = Math.min(curW / img.width, curH / img.height);
    const dw = img.width * s;
    const dh = img.height * s;
    ctx.drawImage(img, curX + (curW - dw) / 2, curY + (curH - dh) / 2, dw, dh);
  } else {
    // Cover mode for Full 9:16 Reels or 1:1 Square
    const s = Math.max(curW / img.width, curH / img.height);
    const sw = curW / s;
    const sh = curH / s;
    const sx = (img.width - sw) / 2;
    const sy = (img.height - sh) / 2;
    ctx.drawImage(img, sx, sy, sw, sh, curX, curY, curW, curH);
  }
}

function drawFrame(sec) {
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, W, H);

  if (sec >= 33.0) {
    drawFinalReveal(sec);
    return;
  }

  const { board, activeMove, cellAlpha, cellScale } = getSceneAtTime(sec);

  for (const [slot, lvl] of Object.entries(board)) {
    const [gx, gy] = SLOTS[slot];
    const alpha = cellAlpha[slot] !== undefined ? cellAlpha[slot] : 1;
    const sc = cellScale[slot] !== undefined ? cellScale[slot] : 1;
    drawSlotPhoto(lvl, gx * CELL, GRID_TOP + gy * CELL, alpha, sc);
  }

  if (activeMove) {
    const [fx, fy] = SLOTS[activeMove.from];
    const [tx, ty] = SLOTS[activeMove.to];
    const cx = (fx + (tx - fx) * activeMove.p) * CELL;
    const cy = GRID_TOP + (fy + (ty - fy) * activeMove.p) * CELL;
    drawSlotPhoto(activeMove.lvl, cx, cy, 1, 1.03);
  }
}

let animId = null;
function startPlayback(onComplete) {
  cancelAnimationFrame(animId);
  const totalDuration = 34.7;
  let startWall = performance.now();
  let audioSynced = false;

  bgAudio.currentTime = 0;
  bgAudio.play().then(() => {
    audioSynced = true;
    startWall = performance.now() - bgAudio.currentTime * 1000;
  }).catch(() => {
    audioSynced = false;
  });

  function loop(now) {
    // High-precision 60/120Hz clock softly locked to audio to prevent frame jitter
    let elapsed = (now - startWall) / 1000;
    if (audioSynced && !bgAudio.paused) {
      const drift = bgAudio.currentTime - elapsed;
      if (Math.abs(drift) > 0.04) {
        startWall = now - bgAudio.currentTime * 1000;
        elapsed = bgAudio.currentTime;
      }
    }

    drawFrame(elapsed);
    statusEl.textContent = `Rendering 60 FPS: ${elapsed.toFixed(1)}s / ${totalDuration}s`;

    if (elapsed < totalDuration && (!audioSynced || !bgAudio.ended)) {
      animId = requestAnimationFrame(loop);
    } else {
      bgAudio.pause();
      drawFrame(totalDuration);
      statusEl.textContent = 'Completed (1080×1920 @ 60 FPS)!';
      if (onComplete) onComplete();
    }
  }
  animId = requestAnimationFrame(loop);
}

document.getElementById('previewBtn').addEventListener('click', () => startPlayback());

document.getElementById('recordBtn').addEventListener('click', () => {
  // Capture at maximum 60 FPS
  const stream = canvas.captureStream(60);

  try {
    const audioStream = bgAudio.captureStream ? bgAudio.captureStream() : (bgAudio.mozCaptureStream ? bgAudio.mozCaptureStream() : null);
    if (audioStream) {
      audioStream.getAudioTracks().forEach(track => stream.addTrack(track));
    }
  } catch (e) {
    console.warn('Audio stream capture note:', e);
  }

  // Prefer native MP4 (H.264) for direct Instagram Reels upload, fallback to VP9 WebM
  const mimeTypes = [
    'video/mp4;codecs=avc1.42E01E,mp4a.40.2',
    'video/mp4',
    'video/webm;codecs=vp9',
    'video/webm'
  ];
  const selectedMime = mimeTypes.find(m => MediaRecorder.isTypeSupported(m)) || 'video/webm';
  const ext = selectedMime.includes('mp4') ? 'mp4' : 'webm';

  const recorder = new MediaRecorder(stream, {
    mimeType: selectedMime,
    videoBitsPerSecond: 16000000 // 16 Mbps for crisp 1080p60 motion
  });

  const chunks = [];
  recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
  recorder.onstop = () => {
    const blob = new Blob(chunks, { type: selectedMime });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `instagram_reel_merge_1080p60.${ext}`;
    a.click();
    document.getElementById('recordBtn').disabled = false;
  };

  document.getElementById('recordBtn').disabled = true;
  recorder.start();
  startPlayback(() => recorder.stop());
});

drawFrame(0);
</script>
</body>
</html>
