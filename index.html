<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instagram Reels 60FPS Photo Merge Maker (Audio-Locked)</title>
<style>
  body { font-family: system-ui, -apple-system, sans-serif; background: #0f0f11; color: #f5f5f5; margin: 0; padding: 16px; display: flex; flex-direction: column; align-items: center; }
  .panel { background: #1a1a1e; padding: 16px; border-radius: 14px; max-width: 560px; width: 100%; box-sizing: border-box; margin-bottom: 16px; border: 1px solid #2e2e34; }
  .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  h2 { margin: 0; font-size: 1.08rem; }
  .pill { background: #10b981; color: #052e16; font-size: 0.72rem; font-weight: 800; padding: 4px 8px; border-radius: 6px; }
  .grid-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  .slot-card { background: #242429; padding: 8px 10px; border-radius: 8px; border: 1px solid #36363e; display: flex; align-items: center; gap: 8px; }
  .thumb { width: 38px; height: 38px; border-radius: 6px; background: #fff; object-fit: contain; flex-shrink: 0; border: 1px solid #444; }
  .slot-info { flex: 1; overflow: hidden; }
  label { font-size: 0.75rem; font-weight: 600; color: #e4e4e7; display: block; margin-bottom: 3px; }
  input[type="file"] { width: 100%; font-size: 0.7rem; color: #a1a1aa; }
  .options-row { display: flex; gap: 10px; margin-bottom: 10px; align-items: center; background: #242429; padding: 8px 12px; border-radius: 8px; border: 1px solid #36363e; font-size: 0.8rem; }
  .options-row select { background: #18181b; color: #fff; border: 1px solid #444; border-radius: 6px; padding: 5px 8px; font-size: 0.78rem; flex: 1; }
  .scrub-row { display: flex; align-items: center; gap: 10px; background: #242429; padding: 8px 12px; border-radius: 8px; border: 1px solid #36363e; margin-bottom: 10px; font-size: 0.78rem; }
  .scrub-row input[type="range"] { flex: 1; accent-color: #3b82f6; cursor: pointer; }
  .audio-bar { background: #1e2923; padding: 8px 12px; border-radius: 8px; font-size: 0.8rem; color: #34d399; border: 1px solid #065f46; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
  .audio-bar.error { background: #2d1a1a; color: #f87171; border-color: #7f1d1d; }
  .btn-row { display: flex; gap: 10px; }
  button { flex: 1; padding: 12px 14px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 0.9rem; transition: opacity 0.15s; }
  #previewBtn { background: #3b82f6; color: #fff; }
  #recordBtn { background: #10b981; color: #fff; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .canvas-wrap { width: 100%; max-width: 340px; aspect-ratio: 9 / 16; border-radius: 14px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.65); border: 2px solid #2e2e34; background: #ffffff; }
  canvas { width: 100%; height: 100%; display: block; }
  #status { font-size: 0.82rem; color: #fbbf24; margin-top: 10px; min-height: 1.2em; text-align: center; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>

<div class="panel">
  <div class="header-row">
    <h2>Reels 3×3 Photo Merge (Audio-Verified)</h2>
    <span class="pill">1080×1920 • 60 FPS</span>
  </div>

  <div class="grid-inputs">
    <div class="slot-card">
      <img id="t1" class="thumb" alt="P1">
      <div class="slot-info"><label>Photo 1 (Baby Cutout)</label><input type="file" id="p1" accept="image/*"></div>
    </div>
    <div class="slot-card">
      <img id="t2" class="thumb" alt="P2">
      <div class="slot-info"><label>Photo 2 (Kid Cutout)</label><input type="file" id="p2" accept="image/*"></div>
    </div>
    <div class="slot-card">
      <img id="t3" class="thumb" alt="P3">
      <div class="slot-info"><label>Photo 3 (Pre-teen 1:1)</label><input type="file" id="p3" accept="image/*"></div>
    </div>
    <div class="slot-card">
      <img id="t4" class="thumb" alt="P4">
      <div class="slot-info"><label>Photo 4 (Teen Cutout)</label><input type="file" id="p4" accept="image/*"></div>
    </div>
    <div class="slot-card">
      <img id="t5" class="thumb" alt="P5">
      <div class="slot-info"><label>Photo 5 (Close-up 1:1)</label><input type="file" id="p5" accept="image/*"></div>
    </div>
    <div class="slot-card">
      <img id="t6" class="thumb" alt="P6">
      <div class="slot-info"><label>Photo 6 (Final Reveal)</label><input type="file" id="p6" accept="image/*"></div>
    </div>
  </div>

  <div class="options-row">
    <span>Final Photo 6 Reveal Mode:</span>
    <select id="finalMode">
      <option value="reels_full">Full 9:16 Reels Screen (1080×1920)</option>
      <option value="reels_fit">Fit Full Width Inside Reels (No Crop)</option>
      <option value="square_center">1:1 Center Square (1080×1080)</option>
    </select>
  </div>

  <div class="scrub-row">
    <span>Scrub Timeline:</span>
    <input type="range" id="scrubber" min="0" max="34.7" step="0.01" value="0">
    <span id="timeLabel">0.00s</span>
  </div>

  <div id="audioStatus" class="audio-bar">
    <span>Audio: <b>audio.mp3</b> (Local Storage)</span>
    <span id="audioState">Checking...</span>
  </div>

  <div class="btn-row">
    <button id="previewBtn">Preview (60 FPS)</button>
    <button id="recordBtn">Record 1080p60 Reels</button>
  </div>
  <div id="status">Select your 6 gallery photos to begin.</div>
</div>

<div class="canvas-wrap">
  <canvas id="stage" width="1080" height="1920"></canvas>
</div>

<audio id="bgAudio" src="audio.mp3" preload="auto"></audio>

<script>
const W = 1080;
const H = 1920;
const GRID_SIZE = 1080;
const CELL = 360;
const GRID_TOP = (H - GRID_SIZE) / 2; // 420px vertical offset for 9:16 Reels safe zone

const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d', { alpha: false, desynchronized: true });
ctx.imageSmoothingEnabled = true;
ctx.imageSmoothingQuality = 'high';

const statusEl = document.getElementById('status');
const bgAudio = document.getElementById('bgAudio');
const audioStatus = document.getElementById('audioStatus');
const audioState = document.getElementById('audioState');
const finalModeSelect = document.getElementById('finalMode');
const scrubber = document.getElementById('scrubber');
const timeLabel = document.getElementById('timeLabel');

const rawImages = {};
const cachedCells = {};

bgAudio.addEventListener('loadedmetadata', () => {
  audioStatus.classList.remove('error');
  audioState.textContent = `Ready (${bgAudio.duration.toFixed(1)}s) ✓`;
});

bgAudio.addEventListener('error', () => {
  audioStatus.classList.add('error');
  audioState.textContent = 'Place audio.mp3 in this folder!';
});

function buildCellCache(lvl, img) {
  const off = document.createElement('canvas');
  off.width = CELL;
  off.height = CELL;
  const octx = off.getContext('2d');
  octx.imageSmoothingEnabled = true;
  octx.imageSmoothingQuality = 'high';

  const pad = 10;
  const box = CELL - pad * 2;

  if (lvl === 3 || lvl === 5) {
    const s = Math.max(box / img.width, box / img.height);
    const sw = box / s;
    const sh = box / s;
    const sx = (img.width - sw) / 2;
    const sy = (img.height - sh) / 2;
    octx.drawImage(img, sx, sy, sw, sh, pad, pad, box, box);
  } else {
    const s = Math.min(box / img.width, box / img.height);
    const w = img.width * s;
    const h = img.height * s;
    octx.drawImage(img, pad + (box - w) / 2, pad + (box - h) / 2, w, h);
  }
  cachedCells[lvl] = off;
}

for (let i = 1; i <= 6; i++) {
  document.getElementById('p' + i).addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const url = URL.createObjectURL(file);
    document.getElementById('t' + i).src = url;
    const img = new Image();
    img.onload = () => {
      rawImages[i] = img;
      buildCellCache(i, img);
      drawFrame(parseFloat(scrubber.value));
    };
    img.src = url;
  });
}

scrubber.addEventListener('input', () => {
  const t = parseFloat(scrubber.value);
  timeLabel.textContent = t.toFixed(2) + 's';
  drawFrame(t);
});

finalModeSelect.addEventListener('change', () => drawFrame(parseFloat(scrubber.value)));

const SLOTS = {
  TL: [0, 0], TC: [1, 0], TR: [2, 0],
  ML: [0, 1], MC: [1, 1], MR: [2, 1],
  BL: [0, 2], BC: [1, 2], BR: [2, 2]
};

// Re-verified 32-merge choreography matched at 0.5s intervals against the reference video & audio.mp3
const TIMELINE = [
  // ROUND 1: Starts with all 9 slots = Photo 1 (7 merges -> MC=4, BR=1)
  { type: 'board', t: 0.00, state: { TL:1, TC:1, TR:1, ML:1, MC:1, MR:1, BL:1, BC:1, BR:1 } },
  { type: 'move',  t: 0.00, dur: 0.52, from: 'TL', to: 'TC', lvl: 1, next: 2 },
  { type: 'move',  t: 0.72, dur: 0.68, from: 'ML', to: 'MC', lvl: 1, next: 2 },
  { type: 'move',  t: 1.68, dur: 0.68, from: 'BL', to: 'BC', lvl: 1, next: 2 },
  { type: 'move',  t: 2.42, dur: 0.58, from: 'TC', to: 'MC', lvl: 2, next: 3 },
  { type: 'move',  t: 3.22, dur: 0.68, from: 'TR', to: 'MR', lvl: 1, next: 2 },
  { type: 'move',  t: 4.18, dur: 0.68, from: 'BC', to: 'MR', lvl: 2, next: 3 },
  { type: 'move',  t: 5.15, dur: 0.68, from: 'MR', to: 'MC', lvl: 3, next: 4 },

  // ROUND 2: "Woo hoo hoo!" top-to-bottom wave spawn (0:06.30) + 8 merges -> MC=5
  { type: 'spawn', t: 6.30, dur: 0.48, cells: ['TL','TC','TR','ML','MR','BL','BC'], lvl: 1 },
  { type: 'move',  t: 6.85, dur: 0.60, from: 'TC', to: 'TR', lvl: 1, next: 2 },
  { type: 'move',  t: 7.72, dur: 0.65, from: 'MR', to: 'BR', lvl: 1, next: 2 },
  { type: 'move',  t: 8.62, dur: 0.65, from: 'TR', to: 'BR', lvl: 2, next: 3 },
  { type: 'move',  t: 9.60, dur: 0.68, from: 'BC', to: 'BL', lvl: 1, next: 2 },
  { type: 'move',  t: 10.60, dur: 0.68, from: 'ML', to: 'TL', lvl: 1, next: 2 },
  { type: 'move',  t: 11.58, dur: 0.68, from: 'BL', to: 'TL', lvl: 2, next: 3 },
  { type: 'move',  t: 12.38, dur: 0.62, from: 'BR', to: 'TL', lvl: 3, next: 4 },
  { type: 'move',  t: 13.28, dur: 0.68, from: 'TL', to: 'MC', lvl: 4, next: 5 },

  // ROUND 3: "Woo hoo hoo!" 8-slot outer ring spawn (0:14.55) + 7 diamond merges -> TC=4, MC=5
  { type: 'spawn', t: 14.55, dur: 0.50, cells: ['TL','TC','TR','ML','MR','BL','BC','BR'], lvl: 1 },
  { type: 'move',  t: 15.18, dur: 0.68, from: 'TL', to: 'ML', lvl: 1, next: 2 },
  { type: 'move',  t: 16.18, dur: 0.68, from: 'BL', to: 'BC', lvl: 1, next: 2 },
  { type: 'move',  t: 17.18, dur: 0.68, from: 'BR', to: 'MR', lvl: 1, next: 2 },
  { type: 'move',  t: 18.18, dur: 0.68, from: 'TR', to: 'TC', lvl: 1, next: 2 },
  { type: 'move',  t: 19.18, dur: 0.68, from: 'ML', to: 'BC', lvl: 2, next: 3 },
  { type: 'move',  t: 20.18, dur: 0.68, from: 'MR', to: 'TC', lvl: 2, next: 3 },
  { type: 'move',  t: 21.15, dur: 0.68, from: 'BC', to: 'TC', lvl: 3, next: 4 },

  // ROUND 4: "Woo hoo hoo!" 7-slot spawn (0:22.15), 4 merges, "Xiannu xiafan" fade-in (0:26.75), 5 final merges -> Photo 6
  { type: 'spawn', t: 22.15, dur: 0.45, cells: ['TL','TR','ML','MR','BL','BC','BR'], lvl: 1 },
  { type: 'move',  t: 22.68, dur: 0.68, from: 'BR', to: 'TL', lvl: 1, next: 2 },
  { type: 'move',  t: 23.68, dur: 0.68, from: 'TR', to: 'MR', lvl: 1, next: 2 },
  { type: 'move',  t: 24.52, dur: 0.58, from: 'BC', to: 'ML', lvl: 1, next: 2 },
  { type: 'move',  t: 25.32, dur: 0.65, from: 'MR', to: 'TL', lvl: 2, next: 3 },

  // "Xiannu xiafan" (仙女下凡) voice cue: bonus Photo 1 fades in smoothly at BC
  { type: 'fadein', t: 26.75, dur: 1.35, cell: 'BC', lvl: 1 },

  { type: 'move',  t: 28.22, dur: 0.68, from: 'BC', to: 'BL', lvl: 1, next: 2 },
  { type: 'move',  t: 29.22, dur: 0.68, from: 'BL', to: 'ML', lvl: 2, next: 3 },
  { type: 'move',  t: 30.25, dur: 0.68, from: 'ML', to: 'TL', lvl: 3, next: 4 },
  { type: 'move',  t: 31.58, dur: 0.72, from: 'TL', to: 'TC', lvl: 4, next: 5 },
  { type: 'move',  t: 32.58, dur: 0.68, from: 'TC', to: 'MC', lvl: 5, next: 6 }
];

// Silky quintic-style smoothstep for natural acceleration and cushioned landing
function smoothGlide(p) {
  p = Math.max(0, Math.min(1, p));
  return p * p * p * (p * (p * 6 - 15) + 10);
}

// Damped spring pop when two photos merge into the upgraded stage
function springPop(dt) {
  if (dt < 0 || dt > 0.26) return 1;
  const u = dt / 0.26;
  return 1 + 0.11 * Math.sin(u * Math.PI * 1.5) * (1 - u);
}

function getSceneAtTime(sec) {
  let board = {};
  let activeMove = null;
  let cellAlpha = {};
  let cellScale = {};
  let mergeCount = 0;

  for (const ev of TIMELINE) {
    if (sec < ev.t) continue;

    if (ev.type === 'board') {
      board = { ...ev.state };
    } else if (ev.type === 'spawn') {
      ev.cells.forEach((c, idx) => {
        const delay = (idx / ev.cells.length) * (ev.dur * 0.55);
        const localT = sec - (ev.t + delay);
        if (localT >= 0) {
          board[c] = ev.lvl;
          if (localT < 0.24) {
            const sp = smoothGlide(localT / 0.24);
            cellScale[c] = 0.25 + 0.75 * sp;
            cellAlpha[c] = sp;
          }
        }
      });
    } else if (ev.type === 'fadein') {
      board[ev.cell] = ev.lvl;
      if (sec < ev.t + ev.dur) {
        const fp = smoothGlide((sec - ev.t) / ev.dur);
        cellAlpha[ev.cell] = fp;
        cellScale[ev.cell] = 0.92 + 0.08 * fp;
      }
    } else if (ev.type === 'move') {
      if (sec < ev.t + ev.dur) {
        delete board[ev.from];
        const rawP = (sec - ev.t) / ev.dur;
        const p = smoothGlide(rawP);

        // Softly compress the target slot just before impact (rawP > 0.80)
        if (rawP > 0.80) {
          const impactP = (rawP - 0.80) / 0.20;
          cellScale[ev.to] = 1 - 0.06 * Math.sin(impactP * Math.PI);
        }

        activeMove = {
          from: ev.from,
          to: ev.to,
          lvl: ev.lvl,
          next: ev.next,
          rawP,
          p
        };
      } else {
        delete board[ev.from];
        board[ev.to] = ev.next;
        mergeCount++;
        const pop = springPop(sec - (ev.t + ev.dur));
        if (pop !== 1) cellScale[ev.to] = pop;
      }
    }
  }
  return { board, activeMove, cellAlpha, cellScale, mergeCount };
}

function drawSlotPhoto(lvl, x, y, alpha = 1, scaleX = 1, scaleY = 1) {
  ctx.save();
  if (alpha !== 1) ctx.globalAlpha = Math.max(0, Math.min(1, alpha));

  if (scaleX !== 1 || scaleY !== 1) {
    const cx = x + CELL / 2;
    const cy = y + CELL / 2;
    ctx.translate(cx, cy);
    ctx.scale(scaleX, scaleY);
    ctx.translate(-cx, -cy);
  }

  const cached = cachedCells[lvl];
  if (cached) {
    ctx.drawImage(cached, x, y);
  } else {
    ctx.fillStyle = '#f3f4f6';
    ctx.fillRect(x + 14, y + 14, CELL - 28, CELL - 28);
    ctx.strokeStyle = '#d1d5db';
    ctx.lineWidth = 2;
    ctx.strokeRect(x + 14, y + 14, CELL - 28, CELL - 28);
    ctx.fillStyle = '#111827';
    ctx.font = 'bold 34px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Photo ' + lvl, x + CELL / 2, y + CELL / 2 + 12);
  }
  ctx.restore();
}

function drawFinalReveal(sec) {
  const expandP = smoothGlide((sec - 33.26) / 0.44);
  const img = rawImages[6];
  const mode = finalModeSelect.value;

  let targetW = W;
  let targetH = (mode === 'square_center') ? W : H;
  if (mode === 'reels_fit' && img) {
    const ratio = img.height / img.width;
    targetH = Math.min(H, W * ratio);
  }

  const curW = CELL + (targetW - CELL) * expandP;
  const curH = CELL + (targetH - CELL) * expandP;
  const curX = (W - curW) / 2;
  const curY = (H - curH) / 2;

  if (!img) {
    ctx.fillStyle = '#f3f4f6';
    ctx.fillRect(curX, curY, curW, curH);
    ctx.fillStyle = '#111827';
    ctx.font = 'bold 52px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Photo 6 (Final Reveal)', W / 2, H / 2);
    return;
  }

  if (mode === 'reels_fit') {
    const s = Math.min(curW / img.width, curH / img.height);
    const dw = img.width * s;
    const dh = img.height * s;
    ctx.drawImage(img, curX + (curW - dw) / 2, curY + (curH - dh) / 2, dw, dh);
  } else {
    const s = Math.max(curW / img.width, curH / img.height);
    const sw = curW / s;
    const sh = curH / s;
    const sx = (img.width - sw) / 2;
    const sy = (img.height - sh) / 2;
    ctx.drawImage(img, sx, sy, sw, sh, curX, curY, curW, curH);
  }
}

function drawFrame(sec) {
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, W, H);

  if (sec >= 33.26) {
    drawFinalReveal(sec);
    return 32;
  }

  const { board, activeMove, cellAlpha, cellScale, mergeCount } = getSceneAtTime(sec);

  for (const [slot, lvl] of Object.entries(board)) {
    const [gx, gy] = SLOTS[slot];
    const alpha = cellAlpha[slot] !== undefined ? cellAlpha[slot] : 1;
    const sc = cellScale[slot] !== undefined ? cellScale[slot] : 1;
    drawSlotPhoto(lvl, gx * CELL, GRID_TOP + gy * CELL, alpha, sc, sc);
  }

  if (activeMove) {
    const [fx, fy] = SLOTS[activeMove.from];
    const [tx, ty] = SLOTS[activeMove.to];
    const cx = (fx + (tx - fx) * activeMove.p) * CELL;
    const cy = GRID_TOP + (fy + (ty - fy) * activeMove.p) * CELL;

    // Velocity-based subtle squash & stretch along movement direction
    const vel = Math.sin(activeMove.rawP * Math.PI);
    const isHoriz = Math.abs(tx - fx) >= Math.abs(ty - fy);
    const sx = 1.02 + (isHoriz ? 0.025 * vel : -0.015 * vel);
    const sy = 1.02 + (isHoriz ? -0.015 * vel : 0.025 * vel);

    // Smooth cross-dissolve during final 15% of merge overlap
    const moveAlpha = activeMove.rawP > 0.85 ? (1 - (activeMove.rawP - 0.85) / 0.15 * 0.35) : 1;
    drawSlotPhoto(activeMove.lvl, cx, cy, moveAlpha, sx, sy);
  }
  return mergeCount;
}

let animId = null;
function startPlayback(onComplete) {
  cancelAnimationFrame(animId);
  const totalDuration = 34.7;
  let lastPerf = performance.now();
  let smoothTime = 0;
  let audioPlaying = false;

  bgAudio.currentTime = 0;
  bgAudio.play().then(() => {
    audioPlaying = true;
  }).catch(() => {
    audioPlaying = false;
  });

  function loop(now) {
    const dt = (now - lastPerf) / 1000;
    lastPerf = now;
    smoothTime += dt;

    // Phase-Locked Loop (PLL) smoothly steers frame time to match bgAudio.currentTime without micro-stutter
    if (audioPlaying && !bgAudio.paused) {
      const audioT = bgAudio.currentTime;
      const err = audioT - smoothTime;
      if (Math.abs(err) > 0.08) {
        smoothTime = audioT;
      } else {
        smoothTime += err * 0.25;
      }
    }

    const merges = drawFrame(smoothTime);
    scrubber.value = Math.min(totalDuration, smoothTime);
    timeLabel.textContent = smoothTime.toFixed(2) + 's';
    statusEl.textContent = `60 FPS Audio-Synced: ${smoothTime.toFixed(2)}s / ${totalDuration}s • Merges: ${merges}/32`;

    if (smoothTime < totalDuration && (!audioPlaying || !bgAudio.ended)) {
      animId = requestAnimationFrame(loop);
    } else {
      bgAudio.pause();
      drawFrame(totalDuration);
      scrubber.value = totalDuration;
      timeLabel.textContent = totalDuration.toFixed(2) + 's';
      statusEl.textContent = 'Completed all 32 merges (1080×1920 @ 60 FPS)!';
      if (onComplete) onComplete();
    }
  }
  animId = requestAnimationFrame(loop);
}

document.getElementById('previewBtn').addEventListener('click', () => startPlayback());

document.getElementById('recordBtn').addEventListener('click', () => {
  const stream = canvas.captureStream(60);

  try {
    const audioStream = bgAudio.captureStream ? bgAudio.captureStream() : (bgAudio.mozCaptureStream ? bgAudio.mozCaptureStream() : null);
    if (audioStream) {
      audioStream.getAudioTracks().forEach(track => stream.addTrack(track));
    }
  } catch (e) {
    console.warn('Audio stream capture note:', e);
  }

  const mimeTypes = [
    'video/mp4;codecs=avc1.42E01E,mp4a.40.2',
    'video/mp4',
    'video/webm;codecs=vp9',
    'video/webm'
  ];
  const selectedMime = mimeTypes.find(m => MediaRecorder.isTypeSupported(m)) || 'video/webm';
  const ext = selectedMime.includes('mp4') ? 'mp4' : 'webm';

  const recorder = new MediaRecorder(stream, {
    mimeType: selectedMime,
    videoBitsPerSecond: 16000000
  });

  const chunks = [];
  recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
  recorder.onstop = () => {
    const blob = new Blob(chunks, { type: selectedMime });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `instagram_reel_merge_1080p60.${ext}`;
    a.click();
    document.getElementById('recordBtn').disabled = false;
  };

  document.getElementById('recordBtn').disabled = true;
  recorder.start();
  startPlayback(() => recorder.stop());
});

drawFrame(0);
</script>
